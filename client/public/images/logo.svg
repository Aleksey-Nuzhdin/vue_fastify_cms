<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b84f9"/>
      <stop offset="100%" stop-color="#89b7ff"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="240" height="240" rx="32" fill="url(#bg)"/>

  <!-- Внутренняя рамка -->
  <rect x="12" y="12" width="216" height="216" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Абстрактный фирменный знак: пересекающиеся геометрические формы -->
  <circle cx="120" cy="105" r="46" fill="#ffffff" fill-opacity="0.18"/>
  <polygon points="120,60 160,130 80,130" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="120" cy="115" r="22" fill="#ffffff"/>

  <!-- Текст -->
  <text x="120" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">BRAND</text>
  <text x="120" y="218" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" letter-spacing="3">TAGLINE</text>
</svg>
